name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs of the same PR / branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 22
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, format, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `postinstall` runs `prisma generate`, which needs no database.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      # Environment validation is lazy: the build needs no database nor secrets.
      - run: npm run build

  e2e:
    name: End-to-end tests (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: activities
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: activities_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U activities -d activities_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Test-only values for a throwaway database: never real secrets.
    env:
      DATABASE_URL: postgresql://activities:ci-test-password@localhost:5432/activities_e2e
      AUTH_SECRET: ci-test-only-auth-secret-not-a-real-secret-0123456789
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ci-test-admin-password
      APP_TIMEZONE: Europe/Paris
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npx playwright install --with-deps chromium
      # Playwright builds and starts the app itself (webServer in playwright.config.ts).
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker image build check
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build runner image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: false
          tags: activities-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build seed image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: seed
          push: false
          tags: activities-seed:ci
          cache-from: type=gha
